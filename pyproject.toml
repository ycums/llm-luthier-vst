[project]
name = "llm-luthier-harness"
version = "0.1.0"
description = "レンダ結果の客観評価指標を算出するハーネス（docs/04-metrics.md）。エンジン本体（フェーズ1以降、C++等）とは別レイヤ。"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "librosa>=0.10",
    "matplotlib>=3.8",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # ruff 0.16 でデフォルトのルールが大幅拡大。CI とローカルで挙動を一致させるため
    # マイナーバージョンで固定する（AGENTS.md 第8節「3回ルール」のカウントが前提）。
    "ruff>=0.16,<0.17",
]

[tool.ruff]
# デフォルトのルールセット(ruff 0.16 の既定)を使う。明示指定はしない。
target-version = "py311"

[project.scripts]
llm-luthier-harness = "harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]
