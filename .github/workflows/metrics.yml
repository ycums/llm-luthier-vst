name: Metrics

# docs/00-vision.md フェーズ0の遷移条件「指標ベクトルがCIで自動出力される」を満たす
# ワークフロー（Issue #13 / P0-13）を、レンダラ導入（P1-07 #52）に合わせて拡張した版。
# run-corpus（プリセット→レンダ→指標算出）と、前回コミットとの差分（diff-corpus）を
# 毎回実行し、結果を成果物とジョブサマリに出す。
#
# 指標の値がどうあれこのワークフロー自体は失敗させない（Q-006の暫定の扱い、
# docs/06-open-questions.md）。失敗させるのは、指標算出そのものが例外で失敗した場合
# （run-corpusの終了コード1）、コーパス実行の成果物件数がマニフェストと食い違う場合、
# および corpus/baseline/ の鮮度検証（下記）が不一致を検出した場合のみ。
#
# #88（#86の決定の実装）：corpus/baseline/ が現在のエンジンでの run-corpus 出力に追いついて
# いるかを検証する（docs/04-metrics.md「更新手順」）。判定はビット完全一致（許容誤差なし）。
# 非同梱音源の取得失敗（status: missing）は誤検出を避けるため比較対象から除外する
# （詳細は harness/baseline_freshness.py のモジュールdocstring）。
#
# #52：レンダラ（engine/cli の luthier-render）を先にビルドし、そのバイナリパスを
# LUTHIER_RENDER_BIN として run-corpus と成果物の一環で使う。
#
# 〔改訂・#94／docs/adr/0008 §7〕本ジョブは ubuntu-latest のみで実行する。指標算出
# （run-corpus）はQ-016（コンパイラ間のビット一致を保証しない）により Linux（開発・CIの
# 基準環境）に一本化し、Windows（MSVC）では行わない。Windowsのビルド・テストは
# `ci.yml: test-windows` が引き続き検証する。旧 `ci.yml: test`（ubuntu）は本ジョブの
# 真部分集合だったため廃止し、Linux/gcc のビルド・テスト検証は本ジョブに統合した。

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # 手動実行。同一コミットに対する複数回実行の決定論検証（Issue #13 完了条件）に使う。
  # workflow_dispatch は paths-ignore の対象外（手動起動のため常に実行される）。
  workflow_dispatch:

# 同一ブランチへの連続pushで古いrunをキャンセルする（Issue #89）。ブランチ保護は
# 無効（required status checksなし、実測: `branches/main` の `protected: false`）
# のため、キャンセルされたrunがマージをブロックする心配はない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 〔改訂・#94〕Windowsエントリを外すとmatrixはubuntu-latest 1件のみになるため、
  # matrix構造を残さず単一ジョブに単純化する（AGENTS.md第8節「先回りして環境を整えない」。
  # Q-016解決等でWindows指標算出を再開する場合はその時点でmatrixに戻す）。
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure engine
        run: cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release
      - name: Build engine
        run: cmake --build engine/build --parallel
      - name: Test engine (ctest)
        run: ctest --test-dir engine/build --output-on-failure
      - name: Export engine binary path
        run: echo "LUTHIER_RENDER_BIN=$(pwd)/engine/build/cli/luthier-render" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        # #52 で lint（ruff）と pytest を metrics.yml にも組み込んだため dev extra が必要
        # （サポート対象2環境でハーネスのテストが通ることを #52 完了条件とする、
        # docs/adr/0008）。
        run: uv sync --extra dev

      - name: Fetch corpus audio (非同梱音源の取得)
        # 同梱不可（bundled: false）の音源を corpus/.cache/ に取得する
        # （corpus/fetch_and_verify.py、corpus/README.md「既知のリスク」参照）。
        # 取得失敗（レート制限・取得不能な環境）はここで止めず、続く
        # run-corpus 側の欠測記録に委ねる（Issue #13 完了条件）。
        id: fetch_corpus
        continue-on-error: true
        run: uv run python corpus/fetch_and_verify.py

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run corpus (プリセット→レンダ→指標ベクトル算出)
        # #52：run-corpus が LUTHIER_RENDER_BIN のレンダラを起動し、各entryの preset_path
        # をレンダしてターゲットと比較する。無音レンダでも欠測として完走する。
        id: run_corpus
        run: |
          start=$(date +%s)
          uv run python -m harness run-corpus \
            --manifest corpus/manifest.json \
            --out metrics_output/current
          echo "elapsed_s=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
        env:
          PYTHONIOENCODING: utf-8

      - name: Run pytest
        run: uv run pytest -q
        env:
          PYTHONIOENCODING: utf-8

      - name: Verify output count (成果物件数の検証)
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("corpus/manifest.json").read_text(encoding="utf-8"))
          index = json.loads(Path("metrics_output/current/index.json").read_text(encoding="utf-8"))
          expected = len(manifest["entries"])
          per_id_files = [
              p for p in Path("metrics_output/current").glob("*.json") if p.name != "index.json"
          ]
          assert index["entry_count"] == expected, (
              f'index.entry_count={index["entry_count"]} != manifest entries={expected}'
          )
          assert len(per_id_files) == expected, (
              f'per-id json files={len(per_id_files)} != manifest entries={expected}'
          )
          print(f"ok: {expected} manifest entries -> {expected} json + index.json")
          PY
        env:
          PYTHONIOENCODING: utf-8

      - name: Check corpus/baseline/ freshness (#88 / #86の決定の実装)
        run: |
          uv run python -m harness check-baseline-freshness \
            --baseline corpus/baseline \
            --current metrics_output/current
        env:
          PYTHONIOENCODING: utf-8

      - name: Compute vectors checksum (決定論検証用)
        # 音源ごとの指標ベクトルJSON（index.jsonを除く。所要時間を含み実行ごとに
        # 変わるため）の合成SHA256をジョブ出力に残す。同一コミットに対する複数回の
        # 実行でこの値が一致することが、Issue #13完了条件「出力JSONがビット単位で
        # 一致する」の確認材料になる。
        id: vectors_checksum
        run: |
          checksum=$(find metrics_output/current -maxdepth 1 -name '*.json' ! -name 'index.json' \
            -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
          echo "sha256=$checksum" >> "$GITHUB_OUTPUT"
          echo "vectors sha256 (index.json除く): $checksum"
        shell: bash

      - name: Upload metrics vectors (成果物)
        uses: actions/upload-artifact@v4
        with:
          name: metrics-vectors
          path: metrics_output/current

      - name: Diff against baseline (前回コミットとの差分)
        id: diff_corpus
        run: |
          start=$(date +%s)
          uv run python -m harness diff-corpus \
            --baseline corpus/baseline \
            --current metrics_output/current \
            --out metrics_output/diff
          echo "elapsed_s=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload diff (成果物)
        uses: actions/upload-artifact@v4
        with:
          name: metrics-diff
          path: metrics_output/diff

      - name: Write job summary
        # ヘッダ（取得/所要時間/決定論チェックサム）に続けて、diff-corpus が生成した
        # report.md（P0-12b-2、人間向け整形出力）をそのままジョブサマリに貼る。
        # 整形ロジックはharness/metrics_diff_report.pyの責務であり、ここでは
        # 二重実装しない（AGENTS.md第8節「先回りして環境を整えない」）。
        env:
          PYTHONIOENCODING: utf-8
          FETCH_CORPUS_OUTCOME: ${{ steps.fetch_corpus.outcome }}
          RUN_CORPUS_ELAPSED_S: ${{ steps.run_corpus.outputs.elapsed_s }}
          DIFF_CORPUS_ELAPSED_S: ${{ steps.diff_corpus.outputs.elapsed_s }}
          VECTORS_SHA256: ${{ steps.vectors_checksum.outputs.sha256 }}
        run: |
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          index = json.loads(Path("metrics_output/current/index.json").read_text(encoding="utf-8"))
          report = Path("metrics_output/diff/report.md").read_text(encoding="utf-8")

          print("## 指標ベクトル自動出力（P0-13 / P1-07）")
          print()
          print("- platform: ubuntu-latest")
          print(f"- fetch corpus audio: {os.environ['FETCH_CORPUS_OUTCOME']}"
                "（失敗しても run-corpus 側の欠測記録に委ねて続行する）")
          print(f"- run-corpus: {index['summary']} / 所要 {os.environ['RUN_CORPUS_ELAPSED_S']}s")
          print(f"- diff-corpus 所要: {os.environ['DIFF_CORPUS_ELAPSED_S']}s")
          print(f"- vectors sha256（index.json除く、決定論検証用）: `{os.environ['VECTORS_SHA256']}`")
          print()
          print(report)
          PY